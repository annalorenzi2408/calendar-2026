    html,
    body {

    /* LOGIN */

    #login-screen {

    #start-screen {

    #month-screen {
        display: none;
        width: 100%;

    .month-page {
        width: 100%;

    /*

     */
    .calendar-wrapper {
        position: relative;
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
    }

    .calendar-image {
        display: block;
        width: 100%;
        height: auto;
    }

    .date-button {
        position: absolute;
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        z-index: 3;
    }

    /*
     * Small maroon mark showing that a day has an event.
     *
     * This is based directly on the supplied reference image:

     * - around 40% down from the top of the date cell
     * - approximately 25px tall in the original 1080x1920 image

    .event-indicator {

<script>
    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
        "https://yfsshafcznyaavxpcopm.supabase.co";

    /*
     * Paste your existing Supabase PUBLISHABLE key here.
     * Do NOT use the service_role/secret key.
     */
    const SUPABASE_KEY =
        "sb_publishable_HiSngqkznKGRf4fV1tZc4g_CWfoTakE";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       APP STATE
    ========================= */

    let currentCalendar = null;
    let currentMonth = null;
    let selectedDay = null;

    /*
     * Events are kept in this format:
     *
     * {
     *   "10": {
     *      "20": [
     *          {
     *              id: "...",
     *              text: "do this"
     *          }
     *      ]
     *   }
     * }
     */

    let events = {};


    /* =========================
       ELEMENTS
    ========================= */

    const loginScreen =
        document.getElementById("login-screen");

    const app =
        document.getElementById("app");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("login-button");

    const loginMessage =
        document.getElementById("login-message");

    const startScreen =
        document.getElementById("start-screen");

    const monthScreen =
        document.getElementById("month-screen");

    const calendarWrapper =
        document.getElementById("calendar-wrapper");

    const calendarImage =
        document.getElementById("calendar-image");

    const eventsList =
        document.getElementById("events-list");

    const eventModal =
        document.getElementById("event-modal");

    const eventText =
        document.getElementById("event-text");

    const modalTitle =
        document.getElementById("modal-title");

    const saveButton =
        document.getElementById("save-button");

    const cancelButton =
        document.getElementById("cancel-button");

    const logoutButton =
        document.getElementById("logout-button");


    /* =========================
       MONTH DATA
    ========================= */

    const monthNames = {
        10: "October",
        11: "November",
        12: "December"
    };

    const monthImages = {
        10: "october.png",
        11: "november.png",
        12: "december.png"
    };


    /*
     * Calendar positions for the 1080 x 1920
     * Canva images.
     *
     * The calendar grid is:
     *
     * left = 112
     * top = 358
     * width = 876
     * height = 667
     */

    const CALENDAR_WIDTH = 1080;
    const CALENDAR_HEIGHT = 1920;

    const GRID_LEFT = 112;
    const GRID_TOP = 358;
    const GRID_WIDTH = 876;
    const GRID_HEIGHT = 667;

    const cellWidth =
        GRID_WIDTH / 7;

    const cellHeight =
        GRID_HEIGHT / 6;


    /* =========================
       LOGIN
    ========================= */

    loginButton.addEventListener(
        "click",
        login
    );

    passwordInput.addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                login();
            }
        }
    );


    async function login() {

        loginMessage.textContent =
            "Logging in...";

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const {
            error
        } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

        if (error) {

            loginMessage.textContent =
                error.message;

            return;
        }

        loginMessage.textContent = "";

        await startApp();
    }


    async function startApp() {

        loginScreen.style.display =
            "none";

        app.style.display =
            "block";

        await findCalendar();

        if (currentCalendar) {

            startScreen.style.display =
                "flex";

            monthScreen.style.display =
                "none";
        }
    }


    /* =========================
       FIND CALENDAR
    ========================= */

    async function findCalendar() {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const {
            data,
            error
        } =
            await supabaseClient
                .from("calendar_members")
                .select(`
                    calendar_id,
                    calendars (
                        id,
                        name
                    )
                `)
                .eq(
                    "user_id",
                    user.id
                );

        if (error) {

            console.error(error);

            alert(
                "Could not load the calendar."
            );

            return;
        }

        if (!data || data.length === 0) {

            alert(
                "You are not a member of a calendar yet."
            );

            return;
        }

        currentCalendar =
            data[0].calendars;
    }


    /* =========================
       MONTH BUTTONS
    ========================= */

    document
        .querySelectorAll(".month-button")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    const month =
                        Number(
                            this.dataset.month
                        );

                    showMonth(month);
                }
            );
        });


    /* =========================
       SHOW MONTH
    ========================= */

    async function showMonth(monthNumber) {

        currentMonth =
            monthNumber;

        startScreen.style.display =
            "none";

        monthScreen.style.display =
            "block";

        calendarImage.src =
            monthImages[monthNumber];

        await loadEvents(monthNumber);

        renderCalendarButtons();

        renderEvents();
    }


    /* =========================
       LOAD EVENTS
    ========================= */

    async function loadEvents(monthNumber) {

        if (!currentCalendar) {
            return;
        }

        const {
            data,
            error
        } =
            await supabaseClient
                .from("events")
                .select("*")
                .eq(
                    "calendar_id",
                    currentCalendar.id
                )
                .eq(
                    "year",
                    2026
                )
                .eq(
                    "month",
                    monthNumber
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );

        if (error) {

            console.error(error);

            alert(
                "Could not load events."
            );

            return;
        }

        events = {};

        data.forEach(event => {

            if (!events[event.month]) {
                events[event.month] = {};
            }

            if (!events[event.month][event.day]) {
                events[event.month][event.day] = [];
            }

            events[event.month][event.day].push({
                id: event.id,
                text: event.text
            });
        });
    }


    /* =========================
       CALENDAR BUTTONS
    ========================= */

    function renderCalendarButtons() {

        /*
         * Remove old date buttons and indicators.
         */

        calendarWrapper
            .querySelectorAll(
                ".date-button, .event-indicator"
            )
            .forEach(element => {
                element.remove();
            });


        const firstDay =
            new Date(
                2026,
                currentMonth - 1,
                1
            ).getDay();

        /*
         * Convert JavaScript Sunday-first
         * numbering into Monday-first.
         */
        const mondayFirstOffset =
            (firstDay + 6) % 7;

        const daysInMonth =
            new Date(
                2026,
                currentMonth,
                0
            ).getDate();


        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const index =
                mondayFirstOffset +
                day -
                1;

            const row =
                Math.floor(
                    index / 7
                );

            const column =
                index % 7;


            const left =
                GRID_LEFT +
                column * cellWidth;

            const top =
                GRID_TOP +
                (row + 1) * cellHeight;


            /*
             * Invisible clickable date button.
             */

            const button =
                document.createElement("button");

            button.className =
                "date-button";

            button.setAttribute(
                "aria-label",
                `${day}, ${monthNames[currentMonth]}`
            );

            button.style.left =
                (
                    left /
                    CALENDAR_WIDTH *
                    100
                ) + "%";

            button.style.top =
                (
                    top /
                    CALENDAR_HEIGHT *
                    100
                ) + "%";

            button.style.width =
                (
                    cellWidth /
                    CALENDAR_WIDTH *
                    100
                ) + "%";

            button.style.height =
                (
                    cellHeight /
                    CALENDAR_HEIGHT *
                    100
                ) + "%";


            button.addEventListener(
                "click",
                function() {

                    openAddEvent(
                        day
                    );
                }
            );


            /*
             * Double-click deletes an event.
             */

            let clickTimer = null;

            button.addEventListener(
                "dblclick",
                function(event) {

                    event.preventDefault();

                    deleteDayEvent(
                        day
                    );
                }
            );


            /*
             * Mobile double-tap support.
             */

            button.addEventListener(
                "touchend",
                function(event) {

                    const now =
                        Date.now();

                    const lastTap =
                        Number(
                            button.dataset.lastTap || 0
                        );

                    if (
                        now - lastTap <
                        350
                    ) {

                        event.preventDefault();

                        deleteDayEvent(
                            day
                        );

                        button.dataset.lastTap =
                            "0";

                    } else {

                        button.dataset.lastTap =
                            String(now);
                    }
                },
                {
                    passive: false
                }
            );


            calendarWrapper.appendChild(
                button
            );


            /*
             * EVENT INDICATOR
             *
             * This is the important change.
             *
             * Reference screenshot:
             *
             * Rectangle:
             * x ≈ 241
             * y ≈ 847
             * width ≈ 116
             * height ≈ 25
             *
             * For a calendar cell this means:
             * - 6px inset from left
             * - 6px inset from right
             * - around 40% down the cell
             */

            const dayEvents =
                events[
                    String(currentMonth)
                ]?.[
                    String(day)
                ] || [];


            if (dayEvents.length > 0) {

                const indicator =
                    document.createElement("div");

                indicator.className =
                    "event-indicator";


                /*
                 * Horizontal placement:
                 * approximately 6px inside
                 * each side of the date cell.
                 */

                const indicatorInset =
                    6;

                indicator.style.left =
                    (
                        (
                            left +
                            indicatorInset
                        ) /
                        CALENDAR_WIDTH *
                        100
                    ) + "%";


                /*
                 * Vertical placement:
                 * approximately 40% down
                 * the date cell.
                 */

                indicator.style.top =
                    (
                        (
                            top +
                            cellHeight * 0.40
                        ) /
                        CALENDAR_HEIGHT *
                        100
                    ) + "%";


                indicator.style.width =
                    (
                        (
                            cellWidth -
                            indicatorInset * 2
                        ) /
                        CALENDAR_WIDTH *
                        100
                    ) + "%";


                /*
                 * 25px in the original
                 * 1080 x 1920 image.
                 */

                indicator.style.height =
                    (
                        25 /
                        CALENDAR_HEIGHT *
                        100
                    ) + "%";


                calendarWrapper.appendChild(
                    indicator
                );
            }
        }
    }


    /* =========================
       RENDER EVENTS
    ========================= */

    function renderEvents() {

        eventsList.innerHTML = "";

        if (!events[currentMonth]) {
            return;
        }


        const monthEvents =
            events[currentMonth];


        const days =
            Object.keys(
                monthEvents
            )
            .map(Number)
            .sort(
                (a, b) => a - b
            );


        days.forEach(day => {

            monthEvents[day].forEach(
                event => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "event-card";

                    card.textContent =
                        `${day}, ${monthNames[currentMonth]} - ${event.text}`;

                    eventsList.appendChild(
                        card
                    );
                }
            );
        });
    }


    /* =========================
       ADD EVENT
    ========================= */

    function openAddEvent(day) {

        selectedDay =
            day;

        modalTitle.textContent =
            `${day}, ${monthNames[currentMonth]}`;

        eventText.value =
            "";

        eventModal.style.display =
            "flex";

        setTimeout(
            () => eventText.focus(),
            50
        );
    }


    cancelButton.addEventListener(
        "click",
        closeModal
    );


    eventModal.addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                eventModal
            ) {
                closeModal();
            }
        }
    );


    eventText.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                saveEvent();
            }
        }
    );


    saveButton.addEventListener(
        "click",
        saveEvent
    );


    function closeModal() {

        eventModal.style.display =
            "none";

        eventText.value =
            "";

        selectedDay =
            null;
    }


    async function saveEvent() {

        const text =
            eventText.value.trim();

        if (!text) {
            return;
        }

        if (!currentCalendar) {
            return;
        }

        saveButton.disabled =
            true;


        const {
            data,
            error
        } =
            await supabaseClient
                .from("events")
                .insert({
                    calendar_id:
                        currentCalendar.id,

                    year:
                        2026,

                    month:
                        currentMonth,

                    day:
                        selectedDay,

                    text:
                        text
                })
                .select()
                .single();


        saveButton.disabled =
            false;


        if (error) {

            console.error(error);

            alert(
                "Could not save the event."
            );

            return;
        }


        if (!events[currentMonth]) {
            events[currentMonth] = {};
        }

        if (!events[currentMonth][selectedDay]) {
            events[currentMonth][selectedDay] = [];
        }


        events[currentMonth][selectedDay].push({
            id: data.id,
            text: data.text
        });


        closeModal();

        renderCalendarButtons();

        renderEvents();
    }


    /* =========================
       DELETE EVENT
    ========================= */

    async function deleteDayEvent(day) {

        const dayEvents =
            events[
                currentMonth
            ]?.[
                day
            ] || [];


        if (dayEvents.length === 0) {
            return;
        }


        let message;

        if (dayEvents.length === 1) {

            message =
                `Delete "${dayEvents[0].text}"?`;

        } else {

            message =
                `Delete all ${dayEvents.length} events on ${day}, ${monthNames[currentMonth]}?`;
        }


        const confirmed =
            confirm(message);


        if (!confirmed) {
            return;
        }


        for (
            const event of dayEvents
        ) {

            const {
                error
            } =
                await supabaseClient
                    .from("events")
                    .delete()
                    .eq(
                        "id",
                        event.id
                    );

            if (error) {

                console.error(error);

                alert(
                    "Could not delete the event."
                );

                return;
            }
        }


        delete events[
            currentMonth
        ][day];


        if (
            Object.keys(
                events[currentMonth]
            ).length === 0
        ) {

            delete events[
                currentMonth
            ];
        }


        renderCalendarButtons();

        renderEvents();
    }


    /* =========================
       LOGOUT
    ========================= */

    logoutButton.addEventListener(
        "click",
        logout
    );


    async function logout() {

        await supabaseClient.auth.signOut();

        app.style.display =
            "none";

        monthScreen.style.display =
            "none";

        startScreen.style.display =
            "none";

        loginScreen.style.display =
            "flex";

        emailInput.value =
            "";

        passwordInput.value =
            "";

        loginMessage.textContent =
            "";

        currentCalendar =
            null;

        currentMonth =
            null;

        events =
            {};
    }


    /* =========================
       CHECK EXISTING SESSION
    ========================= */

    async function checkSession() {

        const {
            data: {
                session
            }
        } =
            await supabaseClient.auth.getSession();


        if (session) {

            await startApp();

        } else {

            loginScreen.style.display =
                "flex";

            app.style.display =
                "none";
        }
    }


    checkSession();

</script>
