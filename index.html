<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#674550"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="2026 Calendar"
    >

    <title>2026 Calendar</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <style>

        @font-face {
            font-family: "BryndanWrite";
            src: url("BryndanWrite.ttf") format("truetype");
        }


        :root {
            --maroon: #674550;
            --cream: #F0DEBD;
            --blue: #9BB7D4;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            background: var(--maroon);
            font-family: "BryndanWrite", cursive;
            overscroll-behavior-y: none;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           APP
           ===================================================== */

        #app {
            width: 100%;
            min-height: 100vh;
            background: var(--maroon);
        }


        /* =====================================================
           POSTER / START SCREEN
           ===================================================== */

        .poster {
            position: relative;
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            aspect-ratio: 9 / 16;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            overflow: hidden;
        }


        .start {
            background-image: url("start.png");
        }


        .click-area {
            position: absolute;
            border: none;
            background: transparent;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }


        .month-button {
            width: 70%;
            height: 18%;
            left: 15%;
        }


        .october-button {
            top: 30%;
        }


        .november-button {
            top: 50%;
        }


        .december-button {
            top: 70%;
        }


        /* =====================================================
           MONTH SCREEN
           ===================================================== */

        .month-image-container {
            position: relative;
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
        }


        .month-image {
            display: block;
            width: 100%;
            height: auto;
        }


        .day-button {
            position: absolute;
            border: none;
            background: transparent;
            padding: 0;
            margin: 0;
            cursor: pointer;
            z-index: 3;
        }


        .back-button {
            top: 1.5%;
            left: 2%;
            width: 12%;
            height: 7%;
            z-index: 5;
        }


        /* =====================================================
           EVENT INDICATOR

           Small solid bar that sits just under the day
           number inside its cell (not a full-width box).
           ===================================================== */

        .event-indicator {
            position: absolute;
            background: var(--maroon);
            border-radius: 10px;
            pointer-events: none;
            z-index: 2;
        }


        /* =====================================================
           EVENTS AREA
           ===================================================== */

        .events-area {
            width: 100%;
            background: var(--blue);
            padding: 24px 0 60px;
        }


        .events-list {
            width: min(88%, 820px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }


        .event-card {
            width: 100%;
            min-height: 110px;
            background: var(--cream);
            border: 3px solid var(--maroon);
            border-radius: 22px;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 25px;
            font-size: 28px;
            line-height: 1.25;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }


        /* =====================================================
           LOGIN
           ===================================================== */

        .login-screen {
            width: 100%;
            min-height: 100vh;
            background: var(--maroon);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }


        .login-box {
            width: min(90%, 500px);
            background: var(--cream);
            border: 3px solid var(--maroon);
            border-radius: 28px;
            padding: 45px 35px;
            text-align: center;
        }


        .login-box h1 {
            margin: 0 0 10px;
            font-size: 42px;
            color: var(--maroon);
        }


        .login-box p {
            margin: 0 0 30px;
            font-size: 24px;
            color: #000;
        }


        .login-box input {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 15px 18px;
            border: 2px solid var(--maroon);
            border-radius: 14px;
            background: white;
            color: #000;
            font-family: sans-serif;
            font-size: 16px;
        }


        .login-button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: var(--maroon);
            color: var(--cream);
            font-family: inherit;
            font-size: 24px;
            cursor: pointer;
        }


        .login-error {
            display: none;
            margin-top: 18px;
            color: #8b0000;
            font-family: sans-serif;
            font-size: 14px;
        }


        /* =====================================================
           LOGOUT
           ===================================================== */

        .logout-button {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            border: 2px solid var(--cream);
            border-radius: 12px;
            background: var(--maroon);
            color: var(--cream);
            padding: 8px 14px;
            font-family: inherit;
            font-size: 17px;
            cursor: pointer;
        }


        /* =====================================================
           MODAL
           ===================================================== */

        .modal-background {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
            z-index: 1000;
        }


        .modal-background.visible {
            display: flex;
        }


        .modal {
            width: min(90%, 520px);
            background: var(--cream);
            border: 3px solid var(--maroon);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
        }


        .modal h2 {
            margin-top: 0;
            color: var(--maroon);
            font-size: 32px;
        }


        .modal input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--maroon);
            border-radius: 12px;
            font-family: sans-serif;
            font-size: 17px;
        }


        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 22px;
        }


        .modal-buttons button {
            border: none;
            border-radius: 12px;
            padding: 12px 22px;
            font-family: inherit;
            font-size: 20px;
            cursor: pointer;
        }


        .add-button {
            background: var(--maroon);
            color: var(--cream);
        }


        .cancel-button {
            background: var(--blue);
            color: #000;
        }


        .delete-button {
            background: #8b0000;
            color: white;
        }


        .delete-message {
            font-family: sans-serif;
            font-size: 17px;
            margin: 20px 0;
            word-break: break-word;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .events-area {
                padding-top: 18px;
                padding-bottom: 50px;
            }


            .events-list {
                width: 90%;
                gap: 20px;
            }


            .event-card {
                min-height: 100px;
                padding: 25px 18px;
                font-size: 22px;
            }


            .login-box {
                padding: 35px 25px;
            }


            .login-box h1 {
                font-size: 34px;
            }


            .login-box p {
                font-size: 21px;
            }


            .logout-button {
                top: 10px;
                right: 10px;
                font-size: 15px;
                padding: 7px 11px;
            }


            .modal {
                padding: 25px 20px;
            }

        }

    </style>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

    <div id="app"></div>


    <!-- =====================================================
         MODAL
         ===================================================== -->

    <div
        class="modal-background"
        id="modalBackground"
    >

        <div
            class="modal"
            id="modal"
        ></div>

    </div>


    <script>

        /* =====================================================
           SUPABASE CONNECTION
           ===================================================== */

        const SUPABASE_URL =
            "https://yfsshafcznyaavxpcopm.supabase.co";


        /*
            IMPORTANT:

            Paste your existing Supabase
            Publishable / anon key here.

            Do NOT use the service_role / secret key.
        */

        const SUPABASE_KEY =
            "sb_publishable_HiSngqkznKGRf4fV1tZc4g_CWfoTakE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           SETTINGS
           ===================================================== */

        const YEAR = 2026;


        const MONTHS = {
            october: 10,
            november: 11,
            december: 12
        };


        const MONTH_NAMES = {
            10: "October",
            11: "November",
            12: "December"
        };


        /* =====================================================
           APP STATE
           ===================================================== */

        let events = {};

        let currentMonth = null;

        let currentUser = null;

        let calendarId = null;


        const app =
            document.getElementById("app");


        const modalBackground =
            document.getElementById(
                "modalBackground"
            );


        const modal =
            document.getElementById("modal");


        /* =====================================================
           AUTHENTICATION
           ===================================================== */

        async function checkLogin() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(error);

                showLogin();

                return;
            }


            currentUser =
                data.session?.user || null;


            if (currentUser) {

                await startCalendar();

            } else {

                showLogin();

            }
        }


        async function login() {

            const email =
                document
                    .getElementById(
                        "loginEmail"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "loginPassword"
                    )
                    .value;


            const errorBox =
                document
                    .getElementById(
                        "loginError"
                    );


            errorBox.style.display =
                "none";


            if (!email || !password) {

                errorBox.textContent =
                    "Please enter your email and password.";

                errorBox.style.display =
                    "block";

                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email,
                        password

                    });


            if (error) {

                console.error(error);

                errorBox.textContent =
                    "Incorrect email or password.";

                errorBox.style.display =
                    "block";

                return;
            }


            currentUser =
                data.user;


            await startCalendar();
        }


        async function logout() {

            await supabaseClient.auth.signOut();

            currentUser = null;

            calendarId = null;

            events = {};

            showLogin();
        }


        /* =====================================================
           LOGIN SCREEN
           ===================================================== */

        function showLogin() {

            app.innerHTML = `

                <section class="login-screen">

                    <div class="login-box">

                        <h1>
                            2026 Calendar
                        </h1>

                        <p>
                            Sign in to continue
                        </p>

                        <input
                            id="loginEmail"
                            type="email"
                            placeholder="Email"
                            autocomplete="email"
                        >

                        <input
                            id="loginPassword"
                            type="password"
                            placeholder="Password"
                            autocomplete="current-password"
                        >

                        <button
                            class="login-button"
                            id="loginButton"
                        >
                            Log in
                        </button>

                        <div
                            id="loginError"
                            class="login-error"
                        ></div>

                    </div>

                </section>
            `;


            document
                .getElementById(
                    "loginButton"
                )
                .addEventListener(
                    "click",
                    login
                );


            document
                .getElementById(
                    "loginPassword"
                )
                .addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            login();

                        }

                    }
                );
        }


        /* =====================================================
           START CALENDAR
           ===================================================== */

        async function startCalendar() {

            const found =
                await findCalendar();


            if (!found) {
                return;
            }


            await loadEvents();

            showStart();
        }


        /* =====================================================
           FIND CALENDAR
           ===================================================== */

        async function findCalendar() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("calendar_members")
                    .select(`
                        calendar_id,
                        calendars (
                            id,
                            name
                        )
                    `)
                    .eq(
                        "user_id",
                        currentUser.id
                    );


            if (error) {

                console.error(error);

                alert(
                    "Could not find your calendar."
                );

                return false;
            }


            if (
                !data ||
                data.length === 0
            ) {

                alert(
                    "Your account is not connected to a calendar yet."
                );

                return false;
            }


            calendarId =
                data[0].calendar_id;


            return true;
        }


        /* =====================================================
           LOAD EVENTS
           ===================================================== */

        async function loadEvents() {

            if (!calendarId) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("events")
                    .select("*")
                    .eq(
                        "calendar_id",
                        calendarId
                    )
                    .eq(
                        "year",
                        YEAR
                    )
                    .order(
                        "month",
                        {
                            ascending: true
                        }
                    )
                    .order(
                        "day",
                        {
                            ascending: true
                        }
                    );


            if (error) {

                console.error(error);

                alert(
                    "Could not load calendar events."
                );

                return;
            }


            events = {};


            data.forEach(event => {

                const monthKey =
                    String(event.month);


                const dayKey =
                    String(event.day);


                if (
                    !events[monthKey]
                ) {

                    events[monthKey] = {};

                }


                if (
                    !events[monthKey][dayKey]
                ) {

                    events[
                        monthKey
                    ][dayKey] = [];

                }


                events[
                    monthKey
                ][dayKey].push({

                    id: event.id,

                    text: event.text

                });

            });
        }


        /* =====================================================
           ADD EVENT
           ===================================================== */

        async function addEvent(
            monthNumber,
            day,
            text
        ) {

            const {
                error
            } =
                await supabaseClient
                    .from("events")
                    .insert({

                        calendar_id:
                            calendarId,

                        year:
                            YEAR,

                        month:
                            monthNumber,

                        day:
                            day,

                        text:
                            text

                    });


            if (error) {

                console.error(error);

                alert(
                    "Could not save the event."
                );

                return false;
            }


            return true;
        }


        /* =====================================================
           DELETE EVENT
           ===================================================== */

        async function deleteEvent(
            eventId
        ) {

            const {
                error
            } =
                await supabaseClient
                    .from("events")
                    .delete()
                    .eq(
                        "id",
                        eventId
                    );


            if (error) {

                console.error(error);

                alert(
                    "Could not delete the event."
                );

                return false;
            }


            return true;
        }


        /* =====================================================
           START SCREEN
           ===================================================== */

        function showStart() {

            currentMonth = null;


            app.innerHTML = `

                <button
                    class="logout-button"
                    id="logoutButton"
                >
                    Log out
                </button>


                <section
                    class="poster start"
                >

                    <button
                        class="click-area month-button october-button"
                        data-month="october"
                    ></button>


                    <button
                        class="click-area month-button november-button"
                        data-month="november"
                    ></button>


                    <button
                        class="click-area month-button december-button"
                        data-month="december"
                    ></button>

                </section>

            `;


            document
                .querySelectorAll(
                    "[data-month]"
                )
                .forEach(button => {

                    button.addEventListener(
                        "click",
                        () => {

                            showMonth(
                                button.dataset.month
                            );

                        }
                    );

                });


            document
                .getElementById(
                    "logoutButton"
                )
                .addEventListener(
                    "click",
                    logout
                );


            window.scrollTo(
                0,
                0
            );
        }


        /* =====================================================
           CALENDAR CALCULATIONS
           ===================================================== */

        function daysInMonth(month) {

            return new Date(
                YEAR,
                month,
                0
            ).getDate();
        }


        function mondayIndex(date) {

            const day =
                date.getDay();


            return (
                (day + 6) % 7
            );
        }


        function getDayPosition(
            month,
            day
        ) {

            const firstDay =
                new Date(
                    YEAR,
                    month - 1,
                    1
                );


            const offset =
                mondayIndex(
                    firstDay
                );


            const index =
                offset + day - 1;


            return {

                row:
                    Math.floor(
                        index / 7
                    ),

                column:
                    index % 7

            };
        }


        /* =====================================================
           MONTH SCREEN
           ===================================================== */

        async function showMonth(
            monthName
        ) {

            currentMonth =
                monthName;


            await loadEvents();


            app.innerHTML = "";


            const monthNumber =
                MONTHS[monthName];


            const totalDays =
                daysInMonth(
                    monthNumber
                );


            /* -------------------------
               LOGOUT
               ------------------------- */

            const logoutButton =
                document.createElement(
                    "button"
                );


            logoutButton.className =
                "logout-button";


            logoutButton.textContent =
                "Log out";


            logoutButton.addEventListener(
                "click",
                logout
            );


            app.appendChild(
                logoutButton
            );


            /* -------------------------
               MONTH IMAGE
               ------------------------- */

            const monthContainer =
                document.createElement(
                    "section"
                );


            monthContainer.className =
                "month-image-container";


            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "month-image";


            image.src =
                `${monthName}.png`;


            image.alt =
                `${MONTH_NAMES[monthNumber]} ${YEAR} calendar`;


            monthContainer.appendChild(
                image
            );


            /* -------------------------
               BACK BUTTON
               ------------------------- */

            const back =
                document.createElement(
                    "button"
                );


            back.className =
                "click-area back-button";


            back.setAttribute(
                "aria-label",
                "Back to months"
            );


            back.addEventListener(
                "click",
                showStart
            );


            monthContainer.appendChild(
                back
            );


            /* -------------------------
               DATE BUTTONS
               ------------------------- */

            const cellWidth =
                876 / 7;


            const cellHeight =
                667 / 6;


            for (
                let day = 1;
                day <= totalDays;
                day++
            ) {

                const position =
                    getDayPosition(
                        monthNumber,
                        day
                    );


                if (
                    position.row >= 6
                ) {

                    continue;

                }


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "day-button";


                const left =
                    112 +
                    position.column *
                    cellWidth;


                const top =
                    358 +
                    (position.row + 1) *
                    cellHeight;


                button.style.left =
                    (
                        left /
                        1080 *
                        100
                    ) + "%";


                button.style.top =
                    (
                        top /
                        1920 *
                        100
                    ) + "%";


                button.style.width =
                    (
                        cellWidth /
                        1080 *
                        100
                    ) + "%";


                button.style.height =
                    (
                        cellHeight /
                        1920 *
                        100
                    ) + "%";


                button.setAttribute(
                    "aria-label",
                    `Add event on ${day} ${MONTH_NAMES[monthNumber]}`
                );


                button.addEventListener(
                    "click",
                    () => {

                        openAddEvent(
                            monthName,
                            day
                        );

                    }
                );


                monthContainer.appendChild(
                    button
                );


                /* =================================================
                   EVENT INDICATOR INSIDE DAY BOX

                   A short bar that sits just under the day
                   number, left-aligned within the cell —
                   matching the hand-drawn underline in the
                   design (not a full-width box).
                   ================================================= */

                const dayEvents =
                    events[
                        String(monthNumber)
                    ]?.[
                        String(day)
                    ] || [];


                if (
                    dayEvents.length > 0
                ) {

                    const indicator =
                        document.createElement(
                            "div"
                        );


                    indicator.className =
                        "event-indicator";


                    const indicatorLeft =
                        left +
                        cellWidth * 0.10;


                    const indicatorTop =
                        top +
                        cellHeight * 0.30;


                    const indicatorWidth =
                        cellWidth * 0.55;


                    const indicatorHeight =
                        cellHeight * 0.10;


                    indicator.style.left =
                        (
                            indicatorLeft /
                            1080 *
                            100
                        ) + "%";


                    indicator.style.top =
                        (
                            indicatorTop /
                            1920 *
                            100
                        ) + "%";


                    indicator.style.width =
                        (
                            indicatorWidth /
                            1080 *
                            100
                        ) + "%";


                    indicator.style.height =
                        (
                            indicatorHeight /
                            1920 *
                            100
                        ) + "%";


                    monthContainer.appendChild(
                        indicator
                    );

                }

            }


            app.appendChild(
                monthContainer
            );


            /* =====================================================
               EVENTS LIST
               ===================================================== */

            const eventsArea =
                document.createElement(
                    "section"
                );


            eventsArea.className =
                "events-area";


            const list =
                document.createElement(
                    "div"
                );


            list.className =
                "events-list";


            const monthKey =
                String(monthNumber);


            const monthEvents =
                events[
                    monthKey
                ] || {};


            const days =
                Object.keys(
                    monthEvents
                )
                .map(Number)
                .sort(
                    (a, b) => a - b
                );


            for (
                const day of days
            ) {

                const dayEvents =
                    monthEvents[
                        String(day)
                    ] || [];


                dayEvents.forEach(
                    eventData => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "event-card";


                        card.textContent =
                            `${day}, ${MONTH_NAMES[monthNumber]} - ${eventData.text}`;


                        /* Desktop double-click */

                        card.addEventListener(
                            "dblclick",
                            event => {

                                event.preventDefault();


                                askDelete(
                                    monthName,
                                    day,
                                    eventData.id,
                                    eventData.text
                                );

                            }
                        );


                        /* Mobile double-tap */

                        let lastTap = 0;


                        card.addEventListener(
                            "touchend",
                            event => {

                                const now =
                                    Date.now();


                                const difference =
                                    now - lastTap;


                                if (
                                    difference > 0 &&
                                    difference < 450
                                ) {

                                    event.preventDefault();


                                    askDelete(
                                        monthName,
                                        day,
                                        eventData.id,
                                        eventData.text
                                    );

                                }


                                lastTap = now;

                            },
                            {
                                passive: false
                            }
                        );


                        list.appendChild(
                            card
                        );

                    }
                );

            }


            eventsArea.appendChild(
                list
            );


            app.appendChild(
                eventsArea
            );


            window.scrollTo(
                0,
                0
            );
        }


        /* =====================================================
           ADD EVENT MODAL
           ===================================================== */

        function openAddEvent(
            monthName,
            day
        ) {

            const monthNumber =
                MONTHS[monthName];


            modal.innerHTML = `

                <h2>
                    ${day}
                    ${MONTH_NAMES[monthNumber]}
                    ${YEAR}
                </h2>


                <input
                    id="eventInput"
                    type="text"
                    maxlength="120"
                    placeholder="Type your event..."
                    autocomplete="off"
                >


                <div class="modal-buttons">

                    <button
                        class="add-button"
                        id="addEvent"
                    >
                        Add
                    </button>


                    <button
                        class="cancel-button"
                        id="cancelAdd"
                    >
                        Cancel
                    </button>

                </div>

            `;


            modalBackground.classList.add(
                "visible"
            );


            const input =
                document.getElementById(
                    "eventInput"
                );


            input.focus();


            document
                .getElementById(
                    "addEvent"
                )
                .addEventListener(
                    "click",
                    async () => {

                        const text =
                            input.value.trim();


                        if (!text) {
                            return;
                        }


                        const success =
                            await addEvent(
                                monthNumber,
                                day,
                                text
                            );


                        if (!success) {
                            return;
                        }


                        closeModal();


                        await showMonth(
                            monthName
                        );

                    }
                );


            document
                .getElementById(
                    "cancelAdd"
                )
                .addEventListener(
                    "click",
                    closeModal
                );


            input.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        document
                            .getElementById(
                                "addEvent"
                            )
                            .click();

                    }


                    if (
                        event.key ===
                        "Escape"
                    ) {

                        closeModal();

                    }

                }
            );
        }


        /* =====================================================
           DELETE EVENT
           ===================================================== */

        function askDelete(
            monthName,
            day,
            eventId,
            text
        ) {

            modal.innerHTML = `

                <h2>
                    Delete event?
                </h2>


                <div class="delete-message">
                    ${escapeHtml(text)}
                </div>


                <div class="modal-buttons">

                    <button
                        class="delete-button"
                        id="confirmDelete"
                    >
                        Delete
                    </button>


                    <button
                        class="cancel-button"
                        id="cancelDelete"
                    >
                        Cancel
                    </button>

                </div>

            `;


            modalBackground.classList.add(
                "visible"
            );


            document
                .getElementById(
                    "confirmDelete"
                )
                .addEventListener(
                    "click",
                    async () => {

                        const success =
                            await deleteEvent(
                                eventId
                            );


                        if (!success) {
                            return;
                        }


                        closeModal();


                        await showMonth(
                            monthName
                        );

                    }
                );


            document
                .getElementById(
                    "cancelDelete"
                )
                .addEventListener(
                    "click",
                    closeModal
                );
        }


        /* =====================================================
           MODAL HELPERS
           ===================================================== */

        function closeModal() {

            modalBackground.classList.remove(
                "visible"
            );


            modal.innerHTML = "";
        }


        modalBackground.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    modalBackground
                ) {

                    closeModal();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeModal();

                }

            }
        );


        /* =====================================================
           HTML ESCAPING
           ===================================================== */

        function escapeHtml(text) {

            return String(text)

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );
        }


        /* =====================================================
           START APP
           ===================================================== */

        checkLogin();

    </script>
