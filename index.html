<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#674550">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="2026 Calendar">

    <title>2026 Calendar</title>

    <link rel="manifest" href="manifest.json">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @font-face {
            font-family: BryndanWrite;
            src: url("BryndanWrite.ttf");
            font-display: swap;
        }

        :root {
            --maroon: #674550;
            --cream: #F0DEBD;
            --blue: #9BB7D4;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--maroon);
        }

        body {
            font-family: BryndanWrite, Georgia, serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-x: none;
        }

        #app {
            width: 100%;
            min-height: 100vh;
            background: var(--maroon);
        }

        /* =========================
           LOGIN SCREEN
           ========================= */

        .login-screen {
            width: 100%;
            min-height: 100vh;

            background: var(--blue);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .login-box {
            width: min(90vw, 420px);

            background: var(--cream);

            border: 2px solid var(--maroon);
            border-radius: 25px;

            padding: 30px 25px;

            text-align: center;

            color: var(--maroon);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .login-box h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .login-box p {
            margin-top: 0;
            margin-bottom: 22px;
            font-size: 18px;
        }

        .login-box input {
            width: 100%;

            padding: 13px;

            margin-bottom: 12px;

            font-family: BryndanWrite, Georgia, serif;
            font-size: 18px;

            border: 1px solid var(--maroon);
            border-radius: 12px;

            outline: none;
        }

        .login-button {
            width: 100%;

            padding: 13px;

            border-radius: 12px;
            border: 1px solid var(--maroon);

            background: var(--maroon);
            color: var(--cream);

            font-family: BryndanWrite, Georgia, serif;
            font-size: 19px;

            cursor: pointer;
        }

        .login-error {
            display: none;

            margin-top: 15px;

            font-family: Arial, sans-serif;
            font-size: 14px;

            color: #8b0000;
        }

        /* =========================
           LOGOUT BUTTON
           ========================= */

        .logout-button {
            position: fixed;

            top: 12px;
            right: 12px;

            z-index: 500;

            border: 1px solid var(--maroon);
            border-radius: 10px;

            background: var(--cream);
            color: var(--maroon);

            padding: 7px 12px;

            font-family: BryndanWrite, Georgia, serif;
            font-size: 15px;

            cursor: pointer;
        }

        /* =========================
           START SCREEN
           ========================= */

        .poster {
            position: relative;
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            aspect-ratio: 9 / 16;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center top;
        }

        .start {
            background-image: url("start.png");
        }

        .october {
            background-image: url("october.png");
        }

        .november {
            background-image: url("november.png");
        }

        .december {
            background-image: url("december.png");
        }

        /* =========================
           INVISIBLE BUTTONS
           ========================= */

        button {
            font-family: inherit;
        }

        .click-area {
            position: absolute;
            border: none;
            background: transparent;
            padding: 0;
            margin: 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        .month-button {
            left: 12.037%;
            width: 75.833%;
            height: 9.531%;
        }

        .month-button.october-button {
            top: 35.677%;
        }

        .month-button.november-button {
            top: 52.604%;
        }

        .month-button.december-button {
            top: 69.531%;
        }

        .back-button {
            left: 0;
            top: 0;
            width: 18%;
            height: 8%;
        }

        /* =========================
           DATE BUTTONS
           ========================= */

        .month-image-container {
            position: relative;
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
        }

        .month-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .day-button {
            position: absolute;
            border: none;
            background: transparent;
            padding: 0;
            margin: 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* =========================
           TASK AREA
           ========================= */

        .events-area {
            width: 100%;
            background: var(--blue);
            padding: 50px 0 70px;
        }

        .events-list {
            width: min(88%, 820px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .event-card {
            width: 100%;
            min-height: 110px;

            background: var(--cream);
            border: 2px solid var(--maroon);
            border-radius: 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            color: black;

            font-size: clamp(17px, 2vw, 22px);
            line-height: 1.25;

            padding: 30px 25px;

            cursor: pointer;
            position: relative;

            user-select: none;
            -webkit-user-select: none;

            touch-action: manipulation;

            transition:
                transform 0.12s ease,
                opacity 0.12s ease;
        }

        .event-card:active {
            transform: scale(0.98);
        }

        .event-card::after {
            content: "Double-tap to delete";

            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;

            text-align: center;

            font-family: Arial, sans-serif;
            font-size: 8px;

            opacity: 0.4;
        }

        /* =========================
           MODAL
           ========================= */

        .modal-background {
            position: fixed;
            inset: 0;

            z-index: 1000;

            background: rgba(0, 0, 0, 0.5);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal-background.visible {
            display: flex;
        }

        .modal {
            width: min(92vw, 430px);

            background: var(--cream);

            border-radius: 25px;

            padding: 25px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);

            text-align: center;

            color: var(--maroon);
        }

        .modal h2 {
            margin-top: 0;
            margin-bottom: 18px;

            font-size: 25px;
        }

        .modal input {
            width: 100%;

            padding: 13px;

            font-family: BryndanWrite, Georgia, serif;
            font-size: 18px;

            border: 1px solid var(--maroon);
            border-radius: 12px;

            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;

            gap: 12px;

            margin-top: 20px;
        }

        .modal button {
            padding: 11px 20px;

            border-radius: 12px;
            border: 1px solid var(--maroon);

            font-family: BryndanWrite, Georgia, serif;
            font-size: 17px;

            cursor: pointer;
        }

        .add-button,
        .delete-button {
            background: var(--maroon);
            color: var(--cream);
        }

        .cancel-button {
            background: var(--cream);
            color: var(--maroon);
        }

        .delete-message {
            font-family: Arial, sans-serif;
            color: #222;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        /* =========================
           SMALL PHONES
           ========================= */

        @media (max-width: 600px) {

            .events-area {
                padding-top: 35px;
                padding-bottom: 50px;
            }

            .events-list {
                width: 90%;
                gap: 20px;
            }

            .event-card {
                min-height: 105px;

                border-radius: 20px;

                padding:
                    28px
                    18px
                    28px;

                font-size: 17px;
            }

            .logout-button {
                top: 8px;
                right: 8px;
                font-size: 13px;
                padding: 6px 9px;
            }
        }

        @media (min-width: 1081px) {

            .poster,
            .month-image-container {
                width: 1080px;
            }
        }
    </style>
</head>

<body>

    <div id="app"></div>

    <div id="modalBackground" class="modal-background">
        <div id="modal" class="modal"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        /* =====================================================
           SUPABASE CONNECTION
           ===================================================== */

        /*
            IMPORTANT:

            Replace ONLY the two values below.

            Get them from:

            Supabase
            → Project Settings
            → API

            Use:
            Project URL
            Publishable key / anon key

            NEVER put the service_role / secret key here.
        */

        const SUPABASE_URL =
            "yfsshafcznyaavxpcopm";

        const SUPABASE_KEY =
            "sb_publishable_HiSngqkznKGRf4fV1tZc4g_CWfoTakE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           SETTINGS
           ===================================================== */

        const YEAR = 2026;

        const MONTHS = {
            october: 10,
            november: 11,
            december: 12
        };

        const MONTH_NAMES = {
            10: "October",
            11: "November",
            12: "December"
        };


        /* =====================================================
           APP STATE
           ===================================================== */

        let events = {};

        let currentMonth = null;

        let currentUser = null;

        let calendarId = null;

        const app =
            document.getElementById("app");

        const modalBackground =
            document.getElementById("modalBackground");

        const modal =
            document.getElementById("modal");


        /* =====================================================
           AUTHENTICATION
           ===================================================== */

        async function checkLogin() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(error);

                showLogin();

                return;
            }


            currentUser =
                data.session?.user || null;


            if (currentUser) {

                await startCalendar();

            } else {

                showLogin();

            }
        }


        async function login() {

            const email =
                document.getElementById(
                    "loginEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "loginPassword"
                ).value;


            const errorBox =
                document.getElementById(
                    "loginError"
                );


            errorBox.style.display = "none";


            if (!email || !password) {

                errorBox.textContent =
                    "Please enter your email and password.";

                errorBox.style.display = "block";

                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });


            if (error) {

                console.error(error);

                errorBox.textContent =
                    "Incorrect email or password.";

                errorBox.style.display = "block";

                return;
            }


            currentUser = data.user;


            await startCalendar();
        }


        async function logout() {

            await supabaseClient.auth.signOut();

            currentUser = null;
            calendarId = null;
            events = {};

            showLogin();
        }


        /* =====================================================
           LOGIN SCREEN
           ===================================================== */

        function showLogin() {

            app.innerHTML = `

                <section class="login-screen">

                    <div class="login-box">

                        <h1>
                            2026 Calendar
                        </h1>

                        <p>
                            Sign in to continue
                        </p>

                        <input
                            id="loginEmail"
                            type="email"
                            placeholder="Email"
                            autocomplete="email"
                        >

                        <input
                            id="loginPassword"
                            type="password"
                            placeholder="Password"
                            autocomplete="current-password"
                        >

                        <button
                            class="login-button"
                            id="loginButton">
                            Log in
                        </button>

                        <div
                            id="loginError"
                            class="login-error">
                        </div>

                    </div>

                </section>
            `;


            document
                .getElementById("loginButton")
                .addEventListener(
                    "click",
                    login
                );


            document
                .getElementById("loginPassword")
                .addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key === "Enter"
                        ) {

                            login();

                        }

                    }
                );
        }


        /* =====================================================
           START CALENDAR
           ===================================================== */

        async function startCalendar() {

            await findCalendar();

            await loadEvents();

            showStart();
        }


        /* =====================================================
           FIND 2026 CALENDAR
           ===================================================== */

        async function findCalendar() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("calendar_members")
                    .select(`
                        calendar_id,
                        calendars (
                            id,
                            name
                        )
                    `)
                    .eq(
                        "user_id",
                        currentUser.id
                    );


            if (error) {

                console.error(error);

                alert(
                    "Could not find your calendar."
                );

                return;
            }


            if (!data || data.length === 0) {

                alert(
                    "Your account is not connected to a calendar yet."
                );

                return;
            }


            calendarId =
                data[0].calendar_id;
        }


        /* =====================================================
           LOAD EVENTS FROM SUPABASE
           ===================================================== */

        async function loadEvents() {

            if (!calendarId) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("events")
                    .select("*")
                    .eq(
                        "calendar_id",
                        calendarId
                    )
                    .eq(
                        "year",
                        YEAR
                    )
                    .order(
                        "month",
                        {
                            ascending: true
                        }
                    )
                    .order(
                        "day",
                        {
                            ascending: true
                        }
                    );


            if (error) {

                console.error(error);

                alert(
                    "Could not load calendar events."
                );

                return;
            }


            events = {};


            data.forEach(event => {

                const monthKey =
                    String(event.month);

                const dayKey =
                    String(event.day);


                if (!events[monthKey]) {

                    events[monthKey] = {};

                }


                if (
                    !events[monthKey][dayKey]
                ) {

                    events[
                        monthKey
                    ][dayKey] = [];

                }


                events[
                    monthKey
                ][dayKey].push({

                    id: event.id,

                    text: event.text

                });

            });
        }


        /* =====================================================
           ADD EVENT TO SUPABASE
           ===================================================== */

        async function addEvent(
            monthNumber,
            day,
            text
        ) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("events")
                    .insert({

                        calendar_id:
                            calendarId,

                        year:
                            YEAR,

                        month:
                            monthNumber,

                        day:
                            day,

                        text:
                            text

                    })
                    .select()
                    .single();


            if (error) {

                console.error(error);

                alert(
                    "Could not save the event."
                );

                return false;
            }


            return true;
        }


        /* =====================================================
           DELETE EVENT FROM SUPABASE
           ===================================================== */

        async function deleteEvent(
            eventId
        ) {

            const {
                error
            } =
                await supabaseClient
                    .from("events")
                    .delete()
                    .eq(
                        "id",
                        eventId
                    );


            if (error) {

                console.error(error);

                alert(
                    "Could not delete the event."
                );

                return false;
            }


            return true;
        }


        /* =====================================================
           START SCREEN
           ===================================================== */

        function showStart() {

            currentMonth = null;

            app.innerHTML = `

                <button
                    class="logout-button"
                    id="logoutButton">
                    Log out
                </button>

                <section class="poster start">

                    <button
                        class="click-area month-button october-button"
                        data-month="october">
                    </button>

                    <button
                        class="click-area month-button november-button"
                        data-month="november">
                    </button>

                    <button
                        class="click-area month-button december-button"
                        data-month="december">
                    </button>

                </section>

            `;


            document
                .querySelectorAll("[data-month]")
                .forEach(button => {

                    button.addEventListener(
                        "click",
                        () => {

                            showMonth(
                                button.dataset.month
                            );

                        }
                    );

                });


            document
                .getElementById("logoutButton")
                .addEventListener(
                    "click",
                    logout
                );


            window.scrollTo(0, 0);
        }


        /* =====================================================
           CALENDAR CALCULATIONS
           ===================================================== */

        function daysInMonth(month) {

            return new Date(
                YEAR,
                month,
                0
            ).getDate();
        }


        function mondayIndex(date) {

            const day =
                date.getDay();

            return (day + 6) % 7;
        }


        function getDayPosition(
            month,
            day
        ) {

            const firstDay =
                new Date(
                    YEAR,
                    month - 1,
                    1
                );


            const offset =
                mondayIndex(
                    firstDay
                );


            const index =
                offset + day - 1;


            return {

                row:
                    Math.floor(
                        index / 7
                    ),

                column:
                    index % 7

            };
        }


        /* =====================================================
           MONTH SCREEN
           ===================================================== */

        async function showMonth(
            monthName
        ) {

            currentMonth = monthName;

            await loadEvents();

            app.innerHTML = "";

            const monthNumber =
                MONTHS[monthName];

            const totalDays =
                daysInMonth(
                    monthNumber
                );


            /* -------------------------
               LOGOUT
               ------------------------- */

            const logout =
                document.createElement(
                    "button"
                );

            logout.className =
                "logout-button";

            logout.textContent =
                "Log out";

            logout.addEventListener(
                "click",
                logout
            );

            app.appendChild(
                logout
            );


            /* -------------------------
               MONTH IMAGE
               ------------------------- */

            const monthContainer =
                document.createElement(
                    "section"
                );

            monthContainer.className =
                "month-image-container";


            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "month-image";

            image.src =
                `${monthName}.png`;

            image.alt =
                `${MONTH_NAMES[monthNumber]} ${YEAR} calendar`;


            monthContainer.appendChild(
                image
            );


            /* -------------------------
               BACK BUTTON
               ------------------------- */

            const back =
                document.createElement(
                    "button"
                );

            back.className =
                "click-area back-button";

            back.setAttribute(
                "aria-label",
                "Back to months"
            );

            back.addEventListener(
                "click",
                showStart
            );

            monthContainer.appendChild(
                back
            );


            /* -------------------------
               DATE BUTTONS
               ------------------------- */

            const cellWidth =
                876 / 7;

            const cellHeight =
                667 / 6;


            for (
                let day = 1;
                day <= totalDays;
                day++
            ) {

                const position =
                    getDayPosition(
                        monthNumber,
                        day
                    );


                if (
                    position.row >= 6
                ) {
                    continue;
                }


                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "day-button";


                const left =
                    112 +
                    position.column *
                    cellWidth;


                const top =
                    358 +
                    (position.row + 1) *
                    cellHeight;


                button.style.left =
                    (
                        left /
                        1080 *
                        100
                    ) + "%";


                button.style.top =
                    (
                        top /
                        1920 *
                        100
                    ) + "%";


                button.style.width =
                    (
                        cellWidth /
                        1080 *
                        100
                    ) + "%";


                button.style.height =
                    (
                        cellHeight /
                        1920 *
                        100
                    ) + "%";


                button.setAttribute(
                    "aria-label",
                    `Add event on ${day} ${MONTH_NAMES[monthNumber]}`
                );


                button.addEventListener(
                    "click",
                    () => {

                        openAddEvent(
                            monthName,
                            day
                        );

                    }
                );


                monthContainer.appendChild(
                    button
                );
            }


            app.appendChild(
                monthContainer
            );


            /* =========================
               EVENTS
               ========================= */

            const eventsArea =
                document.createElement(
                    "section"
                );

            eventsArea.className =
                "events-area";


            const list =
                document.createElement(
                    "div"
                );

            list.className =
                "events-list";


            const monthKey =
                String(monthNumber);


            const monthEvents =
                events[
                    monthKey
                ] || {};


            const days =
                Object.keys(
                    monthEvents
                )
                .map(Number)
                .sort(
                    (a, b) => a - b
                );


            for (
                const day of days
            ) {

                const dayEvents =
                    monthEvents[
                        String(day)
                    ] || [];


                dayEvents.forEach(
                    (eventData) => {

                        const card =
                            document.createElement(
                                "div"
                            );

                        card.className =
                            "event-card";


                        card.textContent =
                            `${day}, ${MONTH_NAMES[monthNumber]} - ${eventData.text}`;


                        /* Desktop double-click */

                        card.addEventListener(
                            "dblclick",
                            event => {

                                event.preventDefault();

                                askDelete(
                                    monthName,
                                    day,
                                    eventData.id,
                                    eventData.text
                                );

                            }
                        );


                        /* Mobile double-tap */

                        let lastTap = 0;


                        card.addEventListener(
                            "touchend",
                            event => {

                                const now =
                                    Date.now();


                                const difference =
                                    now - lastTap;


                                if (
                                    difference > 0 &&
                                    difference < 450
                                ) {

                                    event.preventDefault();

                                    askDelete(
                                        monthName,
                                        day,
                                        eventData.id,
                                        eventData.text
                                    );

                                }


                                lastTap = now;

                            },
                            {
                                passive: false
                            }
                        );


                        list.appendChild(
                            card
                        );

                    }
                );
            }


            eventsArea.appendChild(
                list
            );


            app.appendChild(
                eventsArea
            );


            window.scrollTo(
                0,
                0
            );
        }


        /* =====================================================
           ADD EVENT
           ===================================================== */

        function openAddEvent(
            monthName,
            day
        ) {

            const monthNumber =
                MONTHS[monthName];


            modal.innerHTML = `

                <h2>
                    ${day}
                    ${MONTH_NAMES[monthNumber]}
                    ${YEAR}
                </h2>

                <input
                    id="eventInput"
                    type="text"
                    maxlength="120"
                    placeholder="Type your event..."
                    autocomplete="off"
                >

                <div class="modal-buttons">

                    <button
                        class="add-button"
                        id="addEvent">
                        Add
                    </button>

                    <button
                        class="cancel-button"
                        id="cancelAdd">
                        Cancel
                    </button>

                </div>
            `;


            modalBackground.classList.add(
                "visible"
            );


            const input =
                document.getElementById(
                    "eventInput"
                );


            input.focus();


            document
                .getElementById(
                    "addEvent"
                )
                .addEventListener(
                    "click",
                    async () => {

                        const text =
                            input.value.trim();


                        if (!text) {
                            return;
                        }


                        const success =
                            await addEvent(
                                monthNumber,
                                day,
                                text
                            );


                        if (!success) {
                            return;
                        }


                        closeModal();


                        await showMonth(
                            monthName
                        );

                    }
                );


            document
                .getElementById(
                    "cancelAdd"
                )
                .addEventListener(
                    "click",
                    closeModal
                );


            input.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        document
                            .getElementById(
                                "addEvent"
                            )
                            .click();

                    }


                    if (
                        event.key ===
                        "Escape"
                    ) {

                        closeModal();

                    }

                }
            );
        }


        /* =====================================================
           DELETE EVENT
           ===================================================== */

        function askDelete(
            monthName,
            day,
            eventId,
            text
        ) {

            modal.innerHTML = `

                <h2>
                    Delete event?
                </h2>

                <div class="delete-message">
                    ${escapeHtml(text)}
                </div>

                <div class="modal-buttons">

                    <button
                        class="delete-button"
                        id="confirmDelete">
                        Delete
                    </button>

                    <button
                        class="cancel-button"
                        id="cancelDelete">
                        Cancel
                    </button>

                </div>
            `;


            modalBackground.classList.add(
                "visible"
            );


            document
                .getElementById(
                    "confirmDelete"
                )
                .addEventListener(
                    "click",
                    async () => {

                        const success =
                            await deleteEvent(
                                eventId
                            );


                        if (!success) {
                            return;
                        }


                        closeModal();


                        await showMonth(
                            monthName
                        );

                    }
                );


            document
                .getElementById(
                    "cancelDelete"
                )
                .addEventListener(
                    "click",
                    closeModal
                );
        }


        /* =====================================================
           MODAL HELPERS
           ===================================================== */

        function closeModal() {

            modalBackground.classList.remove(
                "visible"
            );

            modal.innerHTML = "";
        }


        modalBackground.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    modalBackground
                ) {

                    closeModal();
                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeModal();
                }

            }
        );


        function escapeHtml(text) {

            return String(text)

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );
        }


        /* =====================================================
           START APP
           ===================================================== */

        checkLogin();

    </script>

</body>
